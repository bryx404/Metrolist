name: Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build FOSS Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: metrolist-foss-debug-${{ github.run_number }}
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 7
